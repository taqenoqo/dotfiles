# プレフィックス
set-option -g prefix C-t

# viスタイルのキーバインド
set-option -g mode-keys vi

unbind-key l
bind C-t send-prefix
bind-key k select-pane -U
bind-key l select-pane -R
bind-key h select-pane -L
bind-key j select-pane -D
bind-key -r C-k resize-pane -U 10
bind-key -r C-l resize-pane -R 10
bind-key -r C-h resize-pane -L 10
bind-key -r C-j resize-pane -D 10
bind-key K swap-pane -U
bind-key L swap-pane -D
bind-key H swap-pane -U
bind-key J swap-pane -D
# ペインを入れ替えずに左右を60:40にする
bind Enter {
  setw main-pane-width 60%
  select-layout main-vertical
}
bind-key X confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key -r n next-window
bind-key -r p previous-window
bind-key -r N "swap-window -t +1; next"
bind-key -r P "swap-window -t -1; prev"

# マウスでスクロール
set-window-option -g mouse on

# yでバッファをクリップボードにコピー
bind y run-shell '~/.config/tmux/copy.sh'

# ログインシェルとして起動しない
# set-option -g default-command '$SHELL'

# ウインドウ番号を詰める
set-option -g renumber-windows on

# 履歴の記録量
set-option -g history-limit 100000

# フォーカスが外れた・戻ったときにシグナルを投げる
set-option -s focus-events on

# ステータスラインの内容
set -g status-left ' '
set -g status-right '%m/%d(%a) %H:%M:%S '

# ステータスラインの最大長
set -g status-left-length 10
set -g status-right-length 100

# ステータスラインの更新間隔
set -g status-interval 1

# ステータスラインの色、書式
set-option -g status-style fg=colour231,bg=colour111

# ステータスラインの現在選択しているウインドウの色、書式
set-window-option -g window-status-current-style fg=colour111,bg=terminal,bold,underscore

# ステータスラインのウインドウ一覧での色、書式
set-window-option -g window-status-style fg=colour231,bg=colour111

# コピー時の選択範囲と位置表示の色
set -g copy-mode-selection-style fg=colour231,bg=colour218
set -g copy-mode-position-style fg=colour231,bg=colour211

# 確認メッセージの色
set -g message-style fg=colour231,bg=colour218,fill=colour218

# ペインの枠の色
set -g pane-border-style fg=colour153,bg=default
set -g pane-active-border-style fg=colour111,bg=default

# ステータスラインのウインドウ名のフォーマット
set -g automatic-rename on
set -g window-status-format         ' #I:#{?#{m:#W,zsh},#(basename #{pane_current_path}),#W} '
set -g window-status-current-format ' #I:#{?#{m:#W,zsh},#(basename #{pane_current_path}),#W} '

# ウインドウをncursesのACSによる文字罫線ではなくVT100の罫線にする
set -ag terminal-overrides ',*:U8=0'

# 新しい window をカレントディレクトリで開く
bind '"' splitw -v -c '#{pane_current_path}'
bind % splitw -h -c '#{pane_current_path}'
set -s command-alias[100] smart-new-window='if-shell -F "#{>=:#{client_width},280}" {
    neww -a -c "#{pane_current_path}"
    splitw -h -l 40% -c "#{pane_start_path}"
    selectp -L
} {
    neww -a -c "#{pane_current_path}"
}'
bind c smart-new-window
bind C neww -a -c '#{pane_current_path}'
bind s setw synchronize-panes

## windowのpane化
bind-key ! break-pane -a
bind-key | join-pane -t:-1
